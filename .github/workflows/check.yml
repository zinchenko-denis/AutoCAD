name: check

# Лёгкая проверка веток (НЕ main): собрать плагин (csproj) и прогнать тест
# движка. Релиз НЕ публикуется — это делает только build-bundle на main.
# Проверяет C# в штатной Windows-среде независимо от локальной компиляции.

on:
  push:
    branches-ignore: [ main ]
    paths:
      - "ATableSpec/src/**"
      - "ATableSpec/engine/**"
      - "ABlockGen/src/**"
      - "ABlockGen/engine/**"
      - "Facades/src/**"
      - "Facades/engine/**"
      - "Facades/tests/**"
      - "AClad/src/**"
      - "AClad/engine/**"
      - "AFrame/src/**"
      - "AFrame/engine/**"
      - "Common/**"
      # 24.09 (рецензия): правки проверочных инструментов и бандлов тоже
      # запускают проверку
      - "tools/**"
      - "*/tools/**"
      - "*/bundle/**"
      - ".github/workflows/check.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin DLL (compile check)
        run: dotnet build ATableSpec/src/AtSpecPlugin/AtSpecPlugin.csproj -c Release -o build_dll

      - name: Build ABlockGen DLL (compile check)
        run: dotnet build ABlockGen/src/ABlockGenPlugin/ABlockGenPlugin.csproj -c Release -o build_vitrage_dll

      - name: Build AFacades DLL (compile check)
        run: dotnet build Facades/src/AFacadesPlugin/AFacadesPlugin.csproj -c Release -o build_afc_dll

      - name: Build AClad DLL (compile check)
        run: dotnet build AClad/src/ACladPlugin/ACladPlugin.csproj -c Release -o build_acl_dll

      - name: Build AFrame DLL (compile check)
        run: dotnet build AFrame/src/AFramePlugin/AFramePlugin.csproj -c Release -o build_afr_dll

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf pyyaml
          cd ATableSpec/engine
          python test_atspec_report.py
          python test_audit_scenarios.py
          python test_beads.py

      - name: ABlockGen engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd ABlockGen/engine
          python test_vitrage_plan.py
          python test_vitrage_recognize.py
          python test_crash_scenarios.py

      - name: AFacades engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd Facades/engine
          python test_facade_zones.py
          python test_facades_engine.py

      - name: Facade bundle versions and legacy zone adoption
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/facades/test_bundle_versions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Facades/tests/test_zone_migration.py
          exit $LASTEXITCODE

      - name: AClad engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd AClad/engine
          python test_cladding_plan.py
          python test_clad_engine.py
          python test_tile_pattern.py

      - name: AFrame engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd AFrame/engine
          python test_frame_plan.py
          # 23.09 (ревью): расчёт несущей способности и CLI в CI не гонялись
          python test_frame_calc.py
          python test_frame_beam.py
          python test_frame_cutting.py
          python test_frame_engine.py
          python test_frame_rules.py
          python test_frame_topology.py
          python test_frame_topology_index.py
          python test_frame_connections.py
          python test_frame_solution_selection.py

      - name: Native zone geometry regressions (no AutoCAD host)
        shell: pwsh
        run: |
          dotnet build tools/fixes_3009/GeometrySafetyCheck.csproj -c Release -o build_geometry_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build_geometry_check/GeometrySafetyCheck.exe --report build_geometry_check/cases.json
          exit $LASTEXITCODE

      - name: Native zone and layout adapters (CAD API doubles)
        shell: pwsh
        run: |
          dotnet build tools/fixes_3009/test_zone_geometry_adapter.csproj -c Release -o build_geometry_adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fixes_3009/test_zone_geometry_adapter.py --exe build_geometry_adapter/ZoneGeometryAdapterCheck.exe --out geometry_adapter_results
          exit $LASTEXITCODE

      - name: Cladding quantities (native core, real producers, XLSX, CAD API doubles)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install shapely openpyxl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_quantities_core.py --out quantity_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_cladding_producer.py --out quantity_producer_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_cladding_table.py --out quantity_table_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/quantities_3009/QuantityStoreCheck.csproj -c Release -o build_quantity_store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_quantity_store.py --exe build_quantity_store/QuantityStoreCheck.exe --out quantity_store_results
          exit $LASTEXITCODE

      # 24.09 (рецензия): краш-аудиты, стыки модулей, контракт ключей и
      # короткая синтетика фасадов — обязательны. Известные открытые вопросы
      # X6 — ATSPEC, модуль Алексея — остаётся явным исключением.
      # Фасадные регрессии 30.09 обязательны; прежнее исключение F16 снято.
      - name: Frame quantities (core, real producers, XLSX and bounded operation counts)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/frame_quantities_3009/test_frame_core.py --out frame_quantity_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frame_quantities_3009/test_frame_core_perf.py --quick --out frame_quantity_perf_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frame_quantities_3009/test_frame_producer.py --out frame_quantity_producer_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frame_quantities_3009/test_frame_table.py --out frame_quantity_table_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frame_quantities_3009/test_frame_engine_perf.py --targets "1000,3000" --out frame_engine_perf_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/quantities_3009/QuantityStorePerfCheck.csproj -c Release -o build_quantity_store_perf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_quantity_store_perf.py --exe build_quantity_store_perf/QuantityStorePerfCheck.exe --quick --out quantity_store_perf_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/frame_quantities_3009/test_store_encoding.py --out quantity_store_encoding_results
          exit $LASTEXITCODE

      - name: Manual facade quantities (actual mapper, CAD adapters and bounded work)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/manual_quantities_0110/test_manual_core.py --out manual_quantity_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/manual_quantities_0110/test_manual_core_perf.py --quick --out manual_quantity_core_perf_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/manual_quantities_0110/ManualCadCheck.csproj -c Release -o build_manual_cad
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/manual_quantities_0110/test_manual_cad.py --exe build_manual_cad/ManualCadCheck.exe --out manual_cad_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/manual_quantities_0110/test_manual_cad.py --exe build_manual_cad/ManualCadCheck.exe --performance --out manual_cad_perf_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/manual_quantities_0110/test_manual_output.py --out manual_output_results
          exit $LASTEXITCODE

      - name: Facade connection passports (source identities, typed data, XLSX and indexed joins)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/catalog_connections_0110/test_connection_store.py --out connection_store_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/catalog_connections_0110/test_clamps_manual_boundary.py --out connection_clamps_boundary_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/catalog_connections_0110/test_connection_table.py --out connection_table_results --report connection_store_results/independent_zones_report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/orphan_connections_0110/reproduce_gap.py --out orphan_connection_results --expect fixed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/mounting_contract_0110/test_ui.py --out connection_ui_results --report connection_table_results/shared_support/fixture_report.json --orphan-report orphan_connection_results/two_same_coordinate_zones/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/catalog_connections_0110/reproduce_topology_performance.py --out connection_performance_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/facades_beginner_3009/replay_examples.py --out connection_tutorial_results.json
          exit $LASTEXITCODE

      - name: Upload connection table and native preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-table-ui
          path: |
            connection_table_results/
            orphan_connection_results/
            connection_ui_results/
          if-no-files-found: warn

      - name: Historical facade catalogue (actual settings, engine and producer)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/solution_catalog_0110/test_settings_contract.py --out solution_settings_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/solution_catalog_0110/test_solution_ui.py --out solution_ui_results
          exit $LASTEXITCODE

      - name: Pilot mounting interface contract (trace verification, engineering remains blocked)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/pilot_completion_0110/audit_interface_mapping.py --out pilot_completion_contract_results
          exit $LASTEXITCODE

      - name: Upload pilot mounting contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-completion-contract
          path: pilot_completion_contract_results/
          if-no-files-found: warn

      - name: Limited pilot workflow and axis cancellation (explicit CAD doubles)
        timeout-minutes: 5
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/limited_pilot_0110/test_axis_cancel.py --out limited_pilot_results/axis_cancel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/limited_pilot_0110/run_acceptance.py --out limited_pilot_results/workflow
          exit $LASTEXITCODE

      - name: Upload limited pilot workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limited-pilot-acceptance
          path: limited_pilot_results/
          if-no-files-found: warn

      - name: Table command lifecycle (persistent pilot, explicit CAD doubles)
        timeout-minutes: 5
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/table_lifecycle_0110/run_lifecycle.py --out table_lifecycle_results
          exit $LASTEXITCODE

      - name: Upload table command lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-command-lifecycle
          path: table_lifecycle_results/
          if-no-files-found: warn

      - name: Pilot node and table lifecycle (same canonical sources, explicit CAD doubles)
        timeout-minutes: 5
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/node_lifecycle_0110/run_lifecycle.py --out node_lifecycle_results
          exit $LASTEXITCODE

      - name: Upload pilot node and table lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-node-table-lifecycle
          path: node_lifecycle_results/
          if-no-files-found: warn

      - name: Upload historical catalogue UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solution-catalog-ui
          path: solution_ui_results/
          if-no-files-found: warn

      - name: Upload solution settings contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solution-settings-contract
          path: |
            solution_settings_results/*_output.json
            solution_settings_results/serializer_equality_diagnostic.json
            solution_settings_results/manifest.json
            solution_settings_results/compile.log
          if-no-files-found: warn

      - name: Project and zone parameters (native contracts, CAD store and WinForms)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/project_params_0110/test_core.py --out project_parameters_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/project_params_0110/test_store_contract.py --out project_parameters_store_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/project_params_0110/test_integration.py --out project_parameters_integration_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/project_params_0110/test_ui.py --out project_parameters_ui_results
          exit $LASTEXITCODE

      - name: Upload project parameters evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-parameters-ui
          path: |
            project_parameters_core_results/
            project_parameters_store_results/
            project_parameters_integration_results/
            project_parameters_ui_results/
          if-no-files-found: warn

      - name: Pilot node geometry and mounting readiness (core, CAD adapters and WinForms)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/node_geometry_0110/test_core.py --out node_geometry_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/mounting_assessment_0110/test_core.py --out mounting_assessment_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/node_geometry_0110/test_node_cad.py --out node_geometry_cad_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/node_ui_0110/test_ui.py --out node_geometry_ui_results
          exit $LASTEXITCODE

      - name: Upload pilot node geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-geometry
          path: |
            node_geometry_core_results/
            mounting_assessment_core_results/
            node_geometry_cad_results/
            node_geometry_ui_results/
          if-no-files-found: warn

      - name: Facades quick gates (audits, contracts, synth)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install shapely ezdxf pyyaml
          (cd AClad/engine && python audit_clad.py)
          (cd AFrame/engine && python audit_frame.py)
          python tools/engine_contract.py
          python tools/xmod_check.py --no-fixture --allow=X6
          python tools/label_refs_check.py
          python Facades/tools/zones_synth.py --quick
          python AClad/tools/attile_synth.py --quick
          python AFrame/tools/frame_synth.py --quick
          python tools/fixes_3009/run_facade_regressions.py --python-only
          python tools/static_review_3009/reproduce_model_gap.py
          # 29.09: синтетика «в ролях конструктора» — ATFZONE → раскладка → ATFRAME с настройками
          # окна через настоящий FrameSettings (консольный дампер под .NET Framework)
          dotnet build AFrame/tools/roles/RolesDump.csproj -c Release -o build_roles
          ROLES_DUMP_EXE=build_roles/RolesDump.exe python tools/roles_synth.py --quick
