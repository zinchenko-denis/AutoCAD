name: check

# Лёгкая проверка веток (НЕ main): собрать плагин (csproj) и прогнать тест
# движка. Релиз НЕ публикуется — это делает только build-bundle на main.
# Проверяет C# в штатной Windows-среде независимо от локальной компиляции.

on:
  push:
    branches-ignore: [ main ]
    paths:
      - "ATableSpec/src/**"
      - "ATableSpec/engine/**"
      - "ABlockGen/src/**"
      - "ABlockGen/engine/**"
      - "Facades/src/**"
      - "Facades/engine/**"
      - "AClad/src/**"
      - "AClad/engine/**"
      - "AFrame/src/**"
      - "AFrame/engine/**"
      - "Common/**"
      # 24.09 (рецензия): правки проверочных инструментов и бандлов тоже
      # запускают проверку
      - "tools/**"
      - "*/tools/**"
      - "*/bundle/**"
      - ".github/workflows/check.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin DLL (compile check)
        run: dotnet build ATableSpec/src/AtSpecPlugin/AtSpecPlugin.csproj -c Release -o build_dll

      - name: Build ABlockGen DLL (compile check)
        run: dotnet build ABlockGen/src/ABlockGenPlugin/ABlockGenPlugin.csproj -c Release -o build_vitrage_dll

      - name: Build AFacades DLL (compile check)
        run: dotnet build Facades/src/AFacadesPlugin/AFacadesPlugin.csproj -c Release -o build_afc_dll

      - name: Build AClad DLL (compile check)
        run: dotnet build AClad/src/ACladPlugin/ACladPlugin.csproj -c Release -o build_acl_dll

      - name: Build AFrame DLL (compile check)
        run: dotnet build AFrame/src/AFramePlugin/AFramePlugin.csproj -c Release -o build_afr_dll

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf pyyaml
          cd ATableSpec/engine
          python test_atspec_report.py
          python test_audit_scenarios.py
          python test_beads.py

      - name: ABlockGen engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd ABlockGen/engine
          python test_vitrage_plan.py
          python test_vitrage_recognize.py
          python test_crash_scenarios.py

      - name: AFacades engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd Facades/engine
          python test_facade_zones.py
          python test_facades_engine.py

      - name: AClad engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd AClad/engine
          python test_cladding_plan.py
          python test_clad_engine.py
          python test_tile_pattern.py

      - name: AFrame engine unit test
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd AFrame/engine
          python test_frame_plan.py
          # 23.09 (ревью): расчёт несущей способности и CLI в CI не гонялись
          python test_frame_calc.py
          python test_frame_engine.py
          python test_frame_rules.py
          python test_frame_topology.py

      - name: Native zone geometry regressions (no AutoCAD host)
        shell: pwsh
        run: |
          dotnet build tools/fixes_3009/GeometrySafetyCheck.csproj -c Release -o build_geometry_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build_geometry_check/GeometrySafetyCheck.exe --report build_geometry_check/cases.json
          exit $LASTEXITCODE

      - name: Native zone and layout adapters (CAD API doubles)
        shell: pwsh
        run: |
          dotnet build tools/fixes_3009/test_zone_geometry_adapter.csproj -c Release -o build_geometry_adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fixes_3009/test_zone_geometry_adapter.py --exe build_geometry_adapter/ZoneGeometryAdapterCheck.exe --out geometry_adapter_results
          exit $LASTEXITCODE

      - name: Cladding quantities (native core, real producers, XLSX, CAD API doubles)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install shapely openpyxl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_quantities_core.py --out quantity_core_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_cladding_producer.py --out quantity_producer_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_cladding_table.py --out quantity_table_results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/quantities_3009/QuantityStoreCheck.csproj -c Release -o build_quantity_store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quantities_3009/test_quantity_store.py --exe build_quantity_store/QuantityStoreCheck.exe --out quantity_store_results
          exit $LASTEXITCODE

      # 24.09 (рецензия): краш-аудиты, стыки модулей, контракт ключей и
      # короткая синтетика фасадов — обязательны. Известные открытые вопросы
      # X6 — ATSPEC, модуль Алексея — остаётся явным исключением.
      # Фасадные регрессии 30.09 обязательны; прежнее исключение F16 снято.
      - name: Facades quick gates (audits, contracts, synth)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install shapely ezdxf pyyaml
          (cd AClad/engine && python audit_clad.py)
          (cd AFrame/engine && python audit_frame.py)
          python tools/engine_contract.py
          python tools/xmod_check.py --no-fixture --allow=X6
          python tools/label_refs_check.py
          python Facades/tools/zones_synth.py --quick
          python AClad/tools/attile_synth.py --quick
          python AFrame/tools/frame_synth.py --quick
          python tools/fixes_3009/run_facade_regressions.py --python-only
          python tools/static_review_3009/reproduce_model_gap.py
          # 29.09: синтетика «в ролях конструктора» — ATFZONE → раскладка → ATFRAME с настройками
          # окна через настоящий FrameSettings (консольный дампер под .NET Framework)
          dotnet build AFrame/tools/roles/RolesDump.csproj -c Release -o build_roles
          ROLES_DUMP_EXE=build_roles/RolesDump.exe python tools/roles_synth.py --quick
