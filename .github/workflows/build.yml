name: build-bundle

# Собирает пять бандлов на Windows и публикует их вместе с двумя
# руководствами фасадного отдела в build-N и latest. Конструктор
# скачивает три фасадных бандла одного выпуска по инструкции Word.

on:
  push:
    branches: [ main ]
    paths:
      - "ATableSpec/src/**"
      - "ATableSpec/engine/**"
      - "ATableSpec/bundle/**"
      - "ABlockGen/src/**"
      - "ABlockGen/engine/**"
      - "ABlockGen/bundle/**"
      - "Facades/src/**"
      - "Facades/engine/**"
      - "Facades/bundle/**"
      - "AClad/src/**"
      - "AClad/engine/**"
      - "AClad/bundle/**"
      - "AFrame/src/**"
      - "AFrame/engine/**"
      - "AFrame/bundle/**"
      - "Common/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}        # можно запускать вручную кнопкой в разделе Actions

permissions:
  contents: write              # нужно, чтобы опубликовать релиз (см. примечание в README)

jobs:
  # 24.09 (независимая рецензия): выпуск не зависел от тестов — упаковка и
  # публикация шли даже при красных проверках. Теперь build ждёт test.
  test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Engine tests and facade gates
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf==1.4.4 pyyaml==6.0.3 openpyxl==3.1.5 shapely
          (cd ATableSpec/engine && python test_atspec_report.py && python test_audit_scenarios.py && python test_beads.py)
          (cd ABlockGen/engine && python test_vitrage_plan.py && python test_vitrage_recognize.py && python test_crash_scenarios.py)
          (cd Facades/engine && python test_facade_zones.py && python test_facades_engine.py)
          (cd AClad/engine && python test_cladding_plan.py && python test_clad_engine.py && python test_tile_pattern.py && python audit_clad.py)
          (cd AFrame/engine && python test_frame_plan.py && python test_frame_calc.py && python test_frame_beam.py && python test_frame_cutting.py && python test_frame_window_ends.py && python test_frame_engine.py && python audit_frame.py)
          python tools/engine_contract.py
          python tools/xmod_check.py --no-fixture --allow=X6
          python tools/label_refs_check.py
          python Facades/tools/zones_synth.py --quick
          python AClad/tools/attile_synth.py --quick
          python AFrame/tools/frame_synth.py --quick
          python tools/fixes_3009/run_facade_regressions.py --python-only

  build:
    needs: test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Typical facades must build with actual dialog defaults
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          dotnet build AFrame/tools/roles/RolesDump.csproj -c Release -o build_roles
          ROLES_DUMP_EXE=build_roles/RolesDump.exe python AFrame/engine/test_frame_typical_facades.py

      - name: Parametric node library adapters and authoring generator
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python AFrame/tests/test_node_library.py --out build_node_library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/node_library/test_author.py
          exit $LASTEXITCODE

      - name: Check manuals match the release number
        shell: bash
        run: |
          python - <<'PY'
          import os, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          release = 'https://github.com/zinchenko-denis/AutoCAD/releases/tag/build-' + os.environ['GITHUB_RUN_NUMBER']
          for name in ('Facades_User_Manual.docx', 'Install_AutoCAD_2024.docx'):
              with zipfile.ZipFile(Path('docs/user') / name) as archive:
                  rels = ET.fromstring(archive.read('word/_rels/document.xml.rels'))
                  assert any(item.get('Target') == release for item in rels), name + ': update the release link before building'
              print(name + ': release link verified')
          PY

      # 1) Плагин (DLL) — ссылки на AutoCAD берутся из NuGet, AutoCAD не нужен
      - name: Build plugin DLL
        run: dotnet build ATableSpec/src/AtSpecPlugin/AtSpecPlugin.csproj -c Release -o build_dll

      # 2) Движок (EXE) — PyInstaller на Windows даёт Windows-exe со встроенным Python
      - name: Freeze engine EXE
        run: |
          python -m pip install --upgrade pip
          # 24.09 (рецензия): версии закреплены — те же, что дали сборку №22
          pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7 ezdxf==1.4.4 pyyaml==6.0.3 openpyxl==3.1.5
          pyinstaller --onefile --name dxf_spec ATableSpec/engine/dxf_spec.py --distpath build_exe

      # 3) Собрать бандл и упаковать в zip
      - name: Assemble bundle
        shell: pwsh
        run: |
          $b = "ATableSpec.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "ATableSpec/bundle/ATableSpec.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_dll/AtSpecPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_exe/dxf_spec.exe"     "$b/Contents/engine/"
          Copy-Item "ATableSpec/engine/mapping.yaml" "$b/Contents/engine/"
          if (Test-Path "ATableSpec/bundle/ATableSpec.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "ATableSpec/bundle/ATableSpec.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          # 24.09 (рецензия): паспорт сборки рядом с DLL — номер, коммит, дата
          @{ bundle = "ATableSpec"; build = "${{ github.run_number }}"; attempt = "${{ github.run_attempt }}"; sha = "${{ github.sha }}"; ref = "${{ github.ref_name }}"; built_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); python = "3.12.10"; pyinstaller = "6.22.3" } | ConvertTo-Json | Set-Content -Encoding utf8 "$b/Contents/net48/build-info.json"
          Compress-Archive -Path $b -DestinationPath "ATableSpec.bundle.zip" -Force

      # ── ABlockGen (генератор витражей из блоков) — вторая программа, свой бандл ──
      - name: Build ABlockGen DLL
        run: dotnet build ABlockGen/src/ABlockGenPlugin/ABlockGenPlugin.csproj -c Release -o build_abg_dll

      - name: Freeze ABlockGen engine EXE
        run: pyinstaller --onefile --name vitrage_engine --paths ABlockGen/engine ABlockGen/engine/vitrage_engine.py --distpath build_abg_exe

      - name: Assemble ABlockGen bundle
        shell: pwsh
        run: |
          $b = "ABlockGen.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "ABlockGen/bundle/ABlockGen.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_abg_dll/ABlockGenPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_abg_exe/vitrage_engine.exe"  "$b/Contents/engine/"
          Copy-Item "ABlockGen/bundle/ABlockGen.bundle/Contents/icons" "$b/Contents/" -Recurse
          # 24.09 (рецензия): паспорт сборки рядом с DLL — номер, коммит, дата
          @{ bundle = "ABlockGen"; build = "${{ github.run_number }}"; attempt = "${{ github.run_attempt }}"; sha = "${{ github.sha }}"; ref = "${{ github.ref_name }}"; built_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); python = "3.12.10"; pyinstaller = "6.22.3" } | ConvertTo-Json | Set-Content -Encoding utf8 "$b/Contents/net48/build-info.json"
          Compress-Archive -Path $b -DestinationPath "ABlockGen.bundle.zip" -Force

      # ── AFacades (фасады: зоны облицовки) — третья программа, свой бандл ──
      - name: Build AFacades DLL
        run: dotnet build Facades/src/AFacadesPlugin/AFacadesPlugin.csproj -c Release -o build_afc_dll

      - name: Freeze AFacades engine EXE
        run: pyinstaller --onefile --name facades_engine --paths Facades/engine Facades/engine/facades_engine.py --distpath build_afc_exe

      - name: Assemble AFacades bundle
        shell: pwsh
        run: |
          $b = "AFacades.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "Facades/bundle/AFacades.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_afc_dll/AFacadesPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_afc_exe/facades_engine.exe" "$b/Contents/engine/"
          if (Test-Path "Facades/bundle/AFacades.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "Facades/bundle/AFacades.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          # 29.09n (Герман): формы ведомостей работ ATFTABLE — xlsx и карты клеток json
          New-Item -ItemType Directory -Force "$b/Contents/templates" | Out-Null
          Copy-Item "Facades/bundle/AFacades.bundle/Contents/templates/*" "$b/Contents/templates/" -Recurse -Force
          if (-not (Test-Path "$b/Contents/templates/vent.xlsx")) { throw "нет формы ведомости vent.xlsx" }
          # 24.09 (рецензия): паспорт сборки рядом с DLL — номер, коммит, дата
          @{ bundle = "AFacades"; build = "${{ github.run_number }}"; attempt = "${{ github.run_attempt }}"; sha = "${{ github.sha }}"; ref = "${{ github.ref_name }}"; built_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); python = "3.12.10"; pyinstaller = "6.22.3" } | ConvertTo-Json | Set-Content -Encoding utf8 "$b/Contents/net48/build-info.json"
          Compress-Archive -Path $b -DestinationPath "AFacades.bundle.zip" -Force

      # ── AClad (раскладка облицовки, этап 2) — четвёртая программа.
      #    Отдельный бандл; AFacades, AClad и AFrame обновляются
      #    вместе из одной сборки. ──
      - name: Build AClad DLL
        run: dotnet build AClad/src/ACladPlugin/ACladPlugin.csproj -c Release -o build_acl_dll

      - name: Freeze AClad engine EXE
        run: pyinstaller --onefile --name clad_engine --paths AClad/engine AClad/engine/clad_engine.py --distpath build_acl_exe

      - name: Assemble AClad bundle
        shell: pwsh
        run: |
          $b = "AClad.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "AClad/bundle/AClad.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_acl_dll/ACladPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_acl_exe/clad_engine.exe" "$b/Contents/engine/"
          if (Test-Path "AClad/bundle/AClad.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "AClad/bundle/AClad.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          # 24.09 (рецензия): паспорт сборки рядом с DLL — номер, коммит, дата
          @{ bundle = "AClad"; build = "${{ github.run_number }}"; attempt = "${{ github.run_attempt }}"; sha = "${{ github.sha }}"; ref = "${{ github.ref_name }}"; built_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); python = "3.12.10"; pyinstaller = "6.22.3" } | ConvertTo-Json | Set-Content -Encoding utf8 "$b/Contents/net48/build-info.json"
          Compress-Archive -Path $b -DestinationPath "AClad.bundle.zip" -Force

      # ── AFrame (подсистема НВФ: кронштейны/направляющие/кляммеры,
      #    этап 3) — пятая программа. Отдельный бандл; AFacades,
      #    AClad и AFrame обновляются вместе из одной сборки. ──
      - name: Build AFrame DLL
        run: dotnet build AFrame/src/AFramePlugin/AFramePlugin.csproj -c Release -o build_afr_dll

      - name: Freeze AFrame engine EXE
        run: pyinstaller --onefile --name frame_engine --paths AFrame/engine AFrame/engine/frame_engine.py --distpath build_afr_exe

      - name: Assemble AFrame bundle
        shell: pwsh
        run: |
          $b = "AFrame.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "AFrame/bundle/AFrame.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_afr_dll/AFramePlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_afr_exe/frame_engine.exe" "$b/Contents/engine/"
          Copy-Item "AFrame/engine/systems.json" "$b/Contents/engine/"
          if (Test-Path "AFrame/bundle/AFrame.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "AFrame/bundle/AFrame.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          # 24.09 (рецензия): паспорт сборки рядом с DLL — номер, коммит, дата
          @{ bundle = "AFrame"; build = "${{ github.run_number }}"; attempt = "${{ github.run_attempt }}"; sha = "${{ github.sha }}"; ref = "${{ github.ref_name }}"; built_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); python = "3.12.10"; pyinstaller = "6.22.3" } | ConvertTo-Json | Set-Content -Encoding utf8 "$b/Contents/net48/build-info.json"
          Compress-Archive -Path $b -DestinationPath "AFrame.bundle.zip" -Force

      # 4a) Артефакты сборки (видны в разделе Actions; скачивание — для залогиненных)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATableSpec.bundle
          path: ATableSpec.bundle.zip

      - name: Upload ABlockGen artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABlockGen.bundle
          path: ABlockGen.bundle.zip

      - name: Upload AFacades artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFacades.bundle
          path: AFacades.bundle.zip

      - name: Upload AClad artifact
        uses: actions/upload-artifact@v4
        with:
          name: AClad.bundle
          path: AClad.bundle.zip

      - name: Upload AFrame artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFrame.bundle
          path: AFrame.bundle.zip

      # 4b) Релиз "latest" — постоянные прямые ссылки на скачивание для конструктора
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ATableSpec + ABlockGen + AFacades + AClad + AFrame — последняя сборка"
          body: |
            Сборка №${{ github.run_number }}, исходный коммит ${{ github.sha }}.
            Для передачи отделу используйте [этот конкретный выпуск build-${{ github.run_number }}](https://github.com/zinchenko-denis/AutoCAD/releases/tag/build-${{ github.run_number }}).

            **Фасадный комплект для AutoCAD 2024:** скачать AFacades.bundle.zip, AClad.bundle.zip и AFrame.bundle.zip из Assets ниже. Все три модуля устанавливать и обновлять вместе. Source code для установки не нужен.

            **Две инструкции Word в Assets:** Install_AutoCAD_2024.docx — скачивание, установка и обновление; Facades_User_Manual.docx — полный рабочий процесс и учебные фасады с окнами.

            Проверочный выпуск по прямому поручению Дениса от 09.10: переустановить три фасадных модуля вместе и повторить проверки Германом в полном AutoCAD 2024. Нативная приёмка ещё не выполнена; CI и синтетика её не заменяют.

            Включены отсутствующие в №110 исправления ATTILE: точные ключи кэша для близких дробных размеров, запрет округляющего преобразования 35,85 в целочисленное 36 и подробная диагностика свойств в F2. Дополнительно устранено принятие геометрии с отклонением 0,15 мм при правильных значениях свойств. Обычный успех — построенный и измеренный размер 245×35,85, безопасный отказ не считается успехом.

            Исправлен сбой диагностики версий при недоступном Editor: ошибка вывода больше не прерывает следующие обработчики запуска. Причина конкретного ACAD:Фасады в живом AutoCAD ещё не подтверждена.

            Сохранены исправления зон на дробных координатах, HATCH, итоговой пары размеров динамических кассет, оконных стоек и резки 3000 + зазор + добор. Старые зоны принимаются через ATFZONEACCEPT с родным _fzones.json; защита от удаления оригинала через COPY сохранена.

            Отдельный автор узла обновлён до LISP 2026-10-08.2: исправлены завершение Visibility и владение BEDIT/Undo, отмена не должна затрагивать предыдущие действия. Автор и приватный учебный исходник передаются отдельным комплектом. Готового проверенного DWG узла в ZIP модулей нет. Проверка узла: изменить геометрию, размеры и марки трёх выбранных из пяти, два остальных оставить неизменными; затем COPY, Undo и save/open.

            Два руководства обновлены для этого выпуска: чистая переустановка и полный рабочий маршрут с проверками прежних регрессий. В живом AutoCAD ещё открыты дробный обрезок на фактическом блоке Германа, создание узла и ACAD:Фасады. Межэтажный автоматический расчёт и полный монтажный подбор не завершены; неподтверждённые инженерные характеристики не подставлялись.

            ATableSpec.bundle.zip и ABlockGen.bundle.zip относятся к отдельным модулям; для фасадного пилота их обновлять не требуется. Тег latest исторический и на исходный код не указывает; точный срез закреплён в build-${{ github.run_number }}.
          files: |
            ATableSpec.bundle.zip
            ABlockGen.bundle.zip
            AFacades.bundle.zip
            AClad.bundle.zip
            AFrame.bundle.zip
            docs/user/Facades_User_Manual.docx
            docs/user/Install_AutoCAD_2024.docx
            docs/user/Fixes_2026-10-08_09_build111.txt

      # 4c) НЕИЗМЕНЯЕМЫЙ снимок сборки (07.08e, рецензия организации
      # репо): latest перезаписывается, и историческую сборку было
      # не воспроизвести/не откатить. Каждый прогон дополнительно
      # публикует релиз build-<run_number> с теми же пятью архивами,
      # двумя руководствами и SHA кода. Отдел получает конкретный build-N.
      # 24.09 (рецензия): тег создавался на ветке по умолчанию (main от
      # 06.07) — «Source code» релиза не совпадал с бандлами. Теперь тег —
      # на собранный коммит (target_commitish), а повторный прогон (rerun
      # того же номера) снимок НЕ переписывает.
      - name: Publish immutable "build-N" release
        if: github.run_attempt == 1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "build-${{ github.run_number }} (${{ github.sha }})"
          body: |
            Неизменяемый выпуск №${{ github.run_number }}, исходный коммит ${{ github.sha }}.

            **Герману и проектному отделу:** начните с Install_AutoCAD_2024.docx. Для установки скачайте из Assets AFacades.bundle.zip, AClad.bundle.zip и AFrame.bundle.zip — все три из этого выпуска. Полное руководство — Facades_User_Manual.docx. GitHub-вход для скачивания не нужен. Source code содержит исходники, а не установщик.

            Проверочный выпуск от 09.10 по прямому поручению Дениса: новая установка и нативная проверка Германом. Нативная приёмка ещё НЕ выполнена; успешные CI/синтетика не заменяют её.

            Исправлено после №110:
            - ATTILE: близкие дробные размеры больше не разделяют округлённый ключ кэша; исключено собственное округление 35,85→36 при преобразовании типа динамического свойства.
            - ATTILE: геометрия с отклонением 0,15 мм больше не принимается при точных значениях свойств. Числовой шум порядка 1e-12 допускается. При отказе F2 содержит фактическое значение, тип и ограничения свойства.
            - Загрузка: ошибка вывода диагностики версий в Editor больше не прерывает следующие Idle-обработчики; F2 и окно предупреждения независимы.
            - Отдельный LISP автора узла 2026-10-08.2: завершение Visibility, восстановление фактического состояния BEDIT/Undo, защита предыдущей истории от отката при сбое до создания собственного блока. LISP и приватный исходник передаются отдельным комплектом; проверенного DWG в установочных ZIP нет.

            Сохранены исправления предыдущих выпусков: дробные координаты зон и HATCH; проверка итоговой пары размеров кассеты; торцы у окон и верхние боковые стойки; резка 3300 = 3000 + 10 + 290; команды ATFNODEIMPORT/EDIT/DEMO/TEST в XML. ATFNODE остаётся справочной схемой слоёв.

