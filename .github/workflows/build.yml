name: build-bundle

# Собирает готовые ATableSpec.bundle.zip и ABlockGen.bundle.zip на
# Windows-раннере GitHub (ничего ставить локально не нужно) и публикует
# ОБА в релиз "latest". Конструктор скачивает zip по ссылке и просто
# кладёт папку в AutoCAD.

on:
  push:
    branches: [ main ]
    paths:
      - "ATableSpec/src/**"
      - "ATableSpec/engine/**"
      - "ATableSpec/bundle/**"
      - "ABlockGen/src/**"
      - "ABlockGen/engine/**"
      - "ABlockGen/bundle/**"
      - "Facades/src/**"
      - "Facades/engine/**"
      - "Facades/bundle/**"
      - "AClad/src/**"
      - "AClad/engine/**"
      - "AClad/bundle/**"
      - "AFrame/src/**"
      - "AFrame/engine/**"
      - "AFrame/bundle/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}        # можно запускать вручную кнопкой в разделе Actions

permissions:
  contents: write              # нужно, чтобы опубликовать релиз (см. примечание в README)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1) Плагин (DLL) — ссылки на AutoCAD берутся из NuGet, AutoCAD не нужен
      - name: Build plugin DLL
        run: dotnet build ATableSpec/src/AtSpecPlugin/AtSpecPlugin.csproj -c Release -o build_dll

      # 2) Движок (EXE) — PyInstaller на Windows даёт Windows-exe со встроенным Python
      - name: Freeze engine EXE
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ezdxf pyyaml openpyxl
          pyinstaller --onefile --name dxf_spec ATableSpec/engine/dxf_spec.py --distpath build_exe

      # 3) Собрать бандл и упаковать в zip
      - name: Assemble bundle
        shell: pwsh
        run: |
          $b = "ATableSpec.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "ATableSpec/bundle/ATableSpec.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_dll/AtSpecPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_exe/dxf_spec.exe"     "$b/Contents/engine/"
          Copy-Item "ATableSpec/engine/mapping.yaml" "$b/Contents/engine/"
          if (Test-Path "ATableSpec/bundle/ATableSpec.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "ATableSpec/bundle/ATableSpec.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          Compress-Archive -Path $b -DestinationPath "ATableSpec.bundle.zip" -Force

      # ── ABlockGen (генератор витражей из блоков) — вторая программа, свой бандл ──
      - name: Build ABlockGen DLL
        run: dotnet build ABlockGen/src/ABlockGenPlugin/ABlockGenPlugin.csproj -c Release -o build_abg_dll

      - name: Freeze ABlockGen engine EXE
        run: pyinstaller --onefile --name vitrage_engine --paths ABlockGen/engine ABlockGen/engine/vitrage_engine.py --distpath build_abg_exe

      - name: Assemble ABlockGen bundle
        shell: pwsh
        run: |
          $b = "ABlockGen.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "ABlockGen/bundle/ABlockGen.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_abg_dll/ABlockGenPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_abg_exe/vitrage_engine.exe"  "$b/Contents/engine/"
          Copy-Item "ABlockGen/bundle/ABlockGen.bundle/Contents/icons" "$b/Contents/" -Recurse
          Compress-Archive -Path $b -DestinationPath "ABlockGen.bundle.zip" -Force

      # ── AFacades (фасады: зоны облицовки) — третья программа, свой бандл ──
      - name: Build AFacades DLL
        run: dotnet build Facades/src/AFacadesPlugin/AFacadesPlugin.csproj -c Release -o build_afc_dll

      - name: Freeze AFacades engine EXE
        run: pyinstaller --onefile --name facades_engine --paths Facades/engine Facades/engine/facades_engine.py --distpath build_afc_exe

      - name: Assemble AFacades bundle
        shell: pwsh
        run: |
          $b = "AFacades.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "Facades/bundle/AFacades.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_afc_dll/AFacadesPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_afc_exe/facades_engine.exe" "$b/Contents/engine/"
          if (Test-Path "Facades/bundle/AFacades.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "Facades/bundle/AFacades.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          Compress-Archive -Path $b -DestinationPath "AFacades.bundle.zip" -Force

      # ── AClad (раскладка облицовки, этап 2) — четвёртая программа,
      #    СВОЙ бандл: боевой AFacades не переустанавливается при
      #    итерациях раскладки (просьба Германа 22.07) ──
      - name: Build AClad DLL
        run: dotnet build AClad/src/ACladPlugin/ACladPlugin.csproj -c Release -o build_acl_dll

      - name: Freeze AClad engine EXE
        run: pyinstaller --onefile --name clad_engine --paths AClad/engine AClad/engine/clad_engine.py --distpath build_acl_exe

      - name: Assemble AClad bundle
        shell: pwsh
        run: |
          $b = "AClad.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "AClad/bundle/AClad.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_acl_dll/ACladPlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_acl_exe/clad_engine.exe" "$b/Contents/engine/"
          if (Test-Path "AClad/bundle/AClad.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "AClad/bundle/AClad.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          Compress-Archive -Path $b -DestinationPath "AClad.bundle.zip" -Force

      # ── AFrame (подсистема НВФ: кронштейны/направляющие/кляммеры,
      #    этап 3) — пятая программа, СВОЙ бандл (итерационный этап,
      #    AFacades/AClad не трогает) ──
      - name: Build AFrame DLL
        run: dotnet build AFrame/src/AFramePlugin/AFramePlugin.csproj -c Release -o build_afr_dll

      - name: Freeze AFrame engine EXE
        run: pyinstaller --onefile --name frame_engine --paths AFrame/engine AFrame/engine/frame_engine.py --distpath build_afr_exe

      - name: Assemble AFrame bundle
        shell: pwsh
        run: |
          $b = "AFrame.bundle"
          New-Item -ItemType Directory -Force "$b/Contents/net48"  | Out-Null
          New-Item -ItemType Directory -Force "$b/Contents/engine" | Out-Null
          Copy-Item "AFrame/bundle/AFrame.bundle/PackageContents.xml" "$b/"
          Copy-Item "build_afr_dll/AFramePlugin.dll" "$b/Contents/net48/"
          Copy-Item "build_afr_exe/frame_engine.exe" "$b/Contents/engine/"
          Copy-Item "AFrame/engine/systems.json" "$b/Contents/engine/"
          if (Test-Path "AFrame/bundle/AFrame.bundle/Contents/icons") {
            New-Item -ItemType Directory -Force "$b/Contents/icons" | Out-Null
            Copy-Item "AFrame/bundle/AFrame.bundle/Contents/icons/*" "$b/Contents/icons/" -Recurse -Force
          }
          Compress-Archive -Path $b -DestinationPath "AFrame.bundle.zip" -Force

      # 4a) Артефакты сборки (видны в разделе Actions; скачивание — для залогиненных)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATableSpec.bundle
          path: ATableSpec.bundle.zip

      - name: Upload ABlockGen artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABlockGen.bundle
          path: ABlockGen.bundle.zip

      - name: Upload AFacades artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFacades.bundle
          path: AFacades.bundle.zip

      - name: Upload AClad artifact
        uses: actions/upload-artifact@v4
        with:
          name: AClad.bundle
          path: AClad.bundle.zip

      - name: Upload AFrame artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFrame.bundle
          path: AFrame.bundle.zip

      # 4b) Релиз "latest" — постоянные прямые ссылки на скачивание для конструктора
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ATableSpec + ABlockGen + AFacades + AClad + AFrame — последняя сборка"
          body: "Готовые бандлы. ATableSpec.bundle.zip — спецификации/раскрой из блоков (команда ATSPEC). ABlockGen.bundle.zip — генератор витражей из блоков (команды ATVITRAGEAR, ATVITRAGE). AFacades.bundle.zip — фасады, этап 1: зоны облицовки, площади и погонажи (команды ATFZONE, ATFTABLE; ставится один раз). AClad.bundle.zip — фасады, этап 2: раскладка облицовки кассетами (команда ATCLAD; обновляется часто, AFacades не трогает). AFrame.bundle.zip — фасады, этап 3: подсистема НВФ — кронштейны/направляющие/кляммеры по раскладке (команда ATFRAME). Распаковать нужный zip, папку *.bundle положить в %APPDATA%\\Autodesk\\ApplicationPlugins\\, перезапустить AutoCAD."
          files: |
            ATableSpec.bundle.zip
            ABlockGen.bundle.zip
            AFacades.bundle.zip
            AClad.bundle.zip
            AFrame.bundle.zip

      # 4c) НЕИЗМЕНЯЕМЫЙ снимок сборки (07.08e, рецензия организации
      # репо): latest перезаписывается, и историческую сборку было
      # не воспроизвести/не откатить. Каждый прогон дополнительно
      # публикует релиз build-<run_number> с теми же пятью архивами
      # и SHA кода. Ссылки конструкторам НЕ меняются — им latest.
      - name: Publish immutable "build-N" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "build-${{ github.run_number }} (${{ github.sha }})"
          body: "Неизменяемый снимок сборки №${{ github.run_number }} с коммита ${{ github.sha }}. Для установки конструкторами используется релиз latest; этот — для отката и воспроизведения истории."
          make_latest: false
          files: |
            ATableSpec.bundle.zip
            ABlockGen.bundle.zip
            AFacades.bundle.zip
            AClad.bundle.zip
            AFrame.bundle.zip
